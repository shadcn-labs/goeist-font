name: Release font bundles

# `pnpm release` (changeset publish) in packages/goist tags each npm release as
# v<version>; pushing that tag attaches the committed fonts to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Attach Goist and Goist Mono zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Bundle fonts with licenses
        run: |
          set -euo pipefail
          for family in Goist GoistMono; do
            mkdir -p "dist/$family"
            cp -R "fonts/$family/." "dist/$family/"
            cp OFL.txt AUTHORS.txt CONTRIBUTORS.txt README.md "dist/$family/"
            (cd dist && zip -qr "$family-${GITHUB_REF_NAME}.zip" "$family")
          done
      - name: Extract release notes from the package changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading {found=1; next} found && /^## / {exit} found' \
            packages/goist/CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Goist $GITHUB_REF_NAME" --notes-file dist/notes.md \
            "dist/Goist-$GITHUB_REF_NAME.zip" "dist/GoistMono-$GITHUB_REF_NAME.zip"
