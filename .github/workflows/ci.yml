name: Build Goeist fonts and proofs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Compile and verify Goeist and Goeist Mono
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '1767225600'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up Fontspector
        uses: fonttools/setup-fontspector@d53404291dc78a5a41cf76ea48e1d13a731fb812 # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install locked portable toolchain
        run: make venv
      - name: Build upright and italic static, variable and web fonts for every family
        run: make build
      - name: Verify source parity, OpenType behavior and regression tests
        run: make test
      - name: Check with Fontspector
        run: make qa
        continue-on-error: true
      - name: Generate browser proofs
        run: make proof
      - name: Set up test result site
        run: |
          # Proofs load fonts by relative path, so keep the repository layout.
          mkdir -p site/sources
          cp scripts/index.html site/index.html
          cp -R out fonts site/
          for family in fonts/*/; do
            family=$(basename "$family")
            mkdir -p "site/sources/$family/upstream"
            cp -R "sources/$family/upstream/reference" "site/sources/$family/upstream/"
          done
      - name: Collect deployment assets
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site
      - name: Archive fonts, editable sources, reports and licenses
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: goeist-fonts
          if-no-files-found: error
          path: |
            fonts/
            out/
            build/*/sources/*.glyphs
            build/*/rounding-*.json
            build/*/build-manifest.json
            build/*/baseline-manifest.json
            sources/*/config.yaml
            sources/*/upstream/OFL.txt
            sources/*/upstream/LICENSE.txt
            sources/*/upstream/manifest.json
            sources/*/upstream/reference/
            OFL.txt
            AUTHORS.txt
            CONTRIBUTORS.txt
            README.md

  deploy:
    name: Deploy results to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
