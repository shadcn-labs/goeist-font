name: Build Goist fonts and proofs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    name: Compile and verify complete family
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '1767225600'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked portable toolchain
        run: make venv
      - name: Build upright and italic static, variable and web fonts
        run: make build
      - name: Verify source parity, OpenType behavior and regression tests
        run: make test
      - name: Generate browser proofs
        run: make proof
      - name: Archive fonts, editable sources, reports and licenses
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: goist-fonts
          if-no-files-found: error
          path: |
            fonts/Goist/
            out/Goist/
            build/Goist/sources/*.glyphs
            build/Goist/rounding-*.json
            build/Goist/build-manifest.json
            build/Goist/baseline-manifest.json
            sources/Goist/config.yaml
            sources/Goist/upstream/OFL.txt
            sources/Goist/upstream/LICENSE.txt
            sources/Goist/upstream/manifest.json
            sources/Goist/upstream/reference/
            OFL.txt
            AUTHORS.txt
            CONTRIBUTORS.txt
            README.md
