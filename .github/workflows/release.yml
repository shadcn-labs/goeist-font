name: Release

# On every push to main, Changesets opens or updates a "Version packages" PR
# from pending changesets in packages/goeist. Merging that PR bumps the version;
# this workflow then publishes it to npm through trusted publishing (OIDC, no
# token) and creates the GitHub Release with the font zips. npm's trusted
# publisher for `goeist` must name this file: release.yml.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version, publish and release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/goeist
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: packages/goeist/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Pinned so a new npm major cannot change publish semantics under us.
      # 12.2.2 is the version that published 0.0.2. Keep >= 11.5.1 for OIDC.
      - name: Use a pinned npm CLI with trusted publishing (11.5.1+)
        run: npm install -g npm@12.2.2
      - name: Install Changesets
        run: pnpm install --frozen-lockfile

      - name: Open or update the version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0 (v2 requires Changesets CLI v3)
        with:
          cwd: packages/goeist
          version: pnpm run version
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already on npm
        id: version
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "goeist@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publishing, with provenance)
        if: steps.version.outputs.publish == 'true'
        # Provenance is implicit with OIDC, but the flag makes the step fail
        # loudly if id-token: write is ever dropped from this workflow.
        run: npm publish --provenance

      - name: Create the GitHub Release with font zips
        if: steps.version.outputs.publish == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mkdir -p dist
          for family in Goeist GoeistMono; do
            mkdir -p "dist/$family"
            cp -R "fonts/$family/." "dist/$family/"
            cp OFL.txt AUTHORS.txt CONTRIBUTORS.txt README.md "dist/$family/"
            (cd dist && zip -qr "$family-$tag.zip" "$family")
          done
          awk -v heading="## $VERSION" '$0 == heading {found=1; next} found && /^## / {exit} found' \
            packages/goeist/CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Goeist $tag" --notes-file dist/notes.md \
            "dist/Goeist-$tag.zip" "dist/GoeistMono-$tag.zip"
