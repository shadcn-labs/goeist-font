# gftools recipe for Goeist Mono. scripts/build.py supplies `sources` (generated under
# build/GoeistMono/sources/) and `outputDir` (a staging directory), so neither is set here.
familyName: Goeist Mono
version: '1.000'
buildVariable: true
buildStatic: true
buildTTF: true
buildOTF: true
# The driver packs every final TTF, after strict autohinting and timestamp normalization.
buildWebfont: false
buildSmallCap: false
# gftools' built-in TTF recipe uses --fail-ok; the driver instead calls
# ttfautohint-py directly and fails the build if hinting fails.
autohintTTF: false
autohintOTF: false
includeSourceFixes: false
flattenComponents: true
decomposeTransformedComponents: true
checkCompatibility: true
removeOutlineOverlaps: true
splitItalic: false
cleanUp: true
stat:
  GoeistMono[wght].ttf:
    - name: Weight
      tag: wght
      values:
        - name: Thin
          value: 100
        - name: ExtraLight
          value: 200
        - name: Light
          value: 300
        - name: Regular
          value: 400
          linkedValue: 700
          flags: 2
        - name: Medium
          value: 500
        - name: SemiBold
          value: 600
        - name: Bold
          value: 700
        - name: ExtraBold
          value: 800
        - name: Black
          value: 900
    # A STAT style label, not an interpolating fvar axis.
    - name: Italic
      tag: ital
      values:
        - name: Roman
          value: 0
          linkedValue: 1
          flags: 2
  GoeistMono-Italic[wght].ttf:
    - name: Weight
      tag: wght
      values:
        - name: Thin
          value: 100
        - name: ExtraLight
          value: 200
        - name: Light
          value: 300
        - name: Regular
          value: 400
          linkedValue: 700
          flags: 2
        - name: Medium
          value: 500
        - name: SemiBold
          value: 600
        - name: Bold
          value: 700
        - name: ExtraBold
          value: 800
        - name: Black
          value: 900
    - name: Italic
      tag: ital
      values:
        - name: Italic
          value: 1
